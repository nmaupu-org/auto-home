---
TZ: Europe/Paris

# Existing image tools (verified; no image rebuild is required):
# init: Bash, Git, rsync, curl, BusyBox tools. Use portable `timeout -k`.
# reloader: Bash, Git, curl, kubectl, GNU tools and tar; rsync is NOT installed.
# Add any image: yaml key is the name used in any imageSelector
initImage:
  repository: nmaupu/hass-init
  tag: 1.0.3
  pullPolicy: IfNotPresent

#####
# conf reloader custom cronjob configuration
confReloaderImage:
  repository: nmaupu/hass-conf-reloader
  tag: 1.0.1
  pullPolicy: IfNotPresent

serviceAccount:
  conf-reloader:
    enabled: true
    primary: true
    targetSelector:
      - main

rbac:
  conf-reloader:
    enabled: true
    primary: true
    serviceAccounts:
      - conf-reloader
    rules:
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list", "watch", "patch", "update"]
    subjects: []

podOptions:
  automountServiceAccountToken: true
  # emulated_roku relies on SSDP (UDP multicast 239.255.255.250:1900) to be
  # discovered by the Harmony Hub. Multicast does not cross the flannel overlay,
  # so the pod must live in the node's network namespace. This does NOT pin the
  # pod to a node: advertise_ip in hass-config points at the emulated-roku
  # LoadBalancer IP below, which follows the pod wherever it is scheduled.
  # Every node that can run this pod must open 8123/tcp, 8060/tcp and 1900/udp
  # in its host firewall: nix/modules/iot/firewall-extras.nix.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  # TrueCharts adds a *required* podAffinity to co-locate every workload that
  # shares an RWO PVC (label truecharts.org/pvc). With a single Deployment this
  # only glues each new pod to the node of the previous one (rolling update) and
  # leaves it Pending when that node is cordoned/down. Only this Deployment uses
  # the PVCs, and Longhorn re-attaches them on any node, so drop it.
  defaultAffinity: false

workload:
  main:
    podSpec:
      containers:
        conf-reloader:
          enabled: true
          imageSelector: confReloaderImage
          env:
            NAMESPACE:
              fieldRef:
                fieldPath: metadata.namespace
          probes:
            # Loop progress, NOT GitHub reachability. A normal iteration is
            # bounded to < 5 minutes including optional UI downloads.
            liveness:
              enabled: true
              type: exec
              command:
                - bash
                - /config/init/health.sh
            readiness:
              enabled: false
            startup:
              enabled: true
              type: exec
              command:
                - bash
                - /config/init/health.sh
          command:
            - bash
            - /config/init/sync.sh

      initContainers:
        init:
          enabled: true
          type: init
          imageSelector: initImage
          command:
            - bash
            - /config/init/init.sh

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

# Postgres removed: recorder now uses ephemeral SQLite on an emptyDir volume
# (see persistence.recorder + recorder.yaml db_url above). Metrics are wiped
# on pod restart/reschedule by design.
cnpg:
  main:
    enabled: false

persistence:
  recorder:
    # Ephemeral SQLite recorder DB. Wiped when the pod restarts/reschedules.
    # sizeLimit caps growth so a runaway DB fails writes instead of filling
    # the node's ephemeral disk (which would evict the pod).
    enabled: true
    type: emptyDir
    mountPath: /recorder
    size: 4Gi
    targetSelectAll: true
  init:
    enabled: true
    type: configmap
    objectName: init
    mountPath: "/config/init"
    defaultMode: "0777"
    readOnly: true
    targetSelectAll: true
  conf-reloader:
    enabled: true
    type: pvc
    mountPath: /conf-reloader
    targetSelectAll: true
    storageClass: longhorn
    size: 100Mi
  config:
    enabled: true
    type: pvc
    mountPath: /config
    targetSelectAll: true
    storageClass: longhorn
    size: 100Mi
  hass-secrets:
    # Existing secret (sealed-secrets) created under ../../statics
    enabled: true
    type: secret
    objectName: hass-secrets
    mountPath: /hass-secrets
    expandObjectName: false
    targetSelectAll: true
    items:
      - key: secret.yaml
        path: secret.yaml
  hass-passwords:
    # Existing secret (sealed-secrets) created under ../../statics
    enabled: true
    type: secret
    objectName: hass-passwords
    mountPath: /hass-passwords
    expandObjectName: false
    targetSelectAll: true
    items:
      - key: hass-passwords.json
        path: hass-passwords.json

service:
  main:
    enabled: true
    ports:
      main:
        port: 8123
        targetPort: 8123
  emulated-roku:
    # Disabled here on purpose: the TrueCharts common lib forces any Service
    # selecting a hostNetwork pod to ClusterIP, so the LoadBalancer for the
    # Harmony Hub is a raw manifest instead:
    #   ../statics/home-assistant-emulated-roku-svc.yaml (192.168.100.36)
    enabled: false
  # emulated-hue:
  #   enabled: true
  #   ports:
  #     emulated-hue:
  #       enabled: true
  #       port: 80
  #       protocol: tcp
  #       targetPort: 80

# Ingress keeps working with hostNetwork: true because the Service still
# selects the pod (endpoint = node IP:8123).
# Certificate is handled by cert-manager.
ingress:
  main:
    enabled: true
    hosts:
      - host: hass.home.fossar.net
        paths:
          - path: /
            pathType: Prefix
      - host: hass.iot.home.fossar.net
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        certificateIssuer: google-dns-issuer-prod
        enabled: true
      traefik:
        enabled: true
        entrypoints:
          - websecure

configmap:
  init:
    enabled: true
    data:
      # Override the chart's default recorder fragment, which hard-references
      # cnpg creds and fails to render once postgres is disabled. Unused at
      # runtime (conf-reloader writes the real recorder.yaml) but must render.
      recorder.default: |-
        recorder:
          purge_keep_days: 60
          commit_interval: 30
          db_url: "sqlite:////recorder/home-assistant_v2.db"
      onboarding: |-
        {
          "data": {
            "done": [
              "user",
              "core_config",
              "integration"
            ]
          },
          "key": "onboarding",
          "version": 3
        }
      common.sh: |-
        #!/bin/bash
        # Shared paths can be overridden by the isolated regression tests.
        cache_dir="${CACHE_DIR:-/conf-reloader/hass-config}"
        export config_dir="${CONFIG_DIR:-/config}"
        init_dir="${INIT_DIR:-/config/init}"
        export progress_file="${PROGRESS_FILE:-/tmp/conf-reloader-progress}"
        repo_url="${REPO_URL:-https://github.com/nmaupu/hass-config.git}"
        export GIT_TERMINAL_PROMPT=0

        bounded_git() {
          timeout -k 5 "${GIT_TIMEOUT:-30}" git \
            -c http.lowSpeedLimit=1 -c http.lowSpeedTime=15 "$@"
        }

        refresh_repo() {
          if [ ! -d "$cache_dir/.git" ]; then
            # Never expose an incomplete clone or delete a cached config on
            # failure.
            rm -rf "${cache_dir}.clone"
            bounded_git clone --branch master "$repo_url" \
              "${cache_dir}.clone" || return
            test -s "${cache_dir}.clone/configuration.yaml" || return 1
            if [ -d "$cache_dir/www" ]; then
              cp -a "$cache_dir/www" "${cache_dir}.clone/" || return
            fi
            rm -rf "${cache_dir}.previous"
            if [ -d "$cache_dir" ]; then
              mv "$cache_dir" "${cache_dir}.previous" || return
            fi
            if ! mv "${cache_dir}.clone" "$cache_dir"; then
              if [ -d "${cache_dir}.previous" ]; then
                mv "${cache_dir}.previous" "$cache_dir"
              fi
              return 1
            fi
            rm -rf "${cache_dir}.previous"
          else
            bounded_git -C "$cache_dir" fetch origin master || return
            if [ ! -s "$cache_dir/configuration.yaml" ] || \
               [ "$(git -C "$cache_dir" rev-parse HEAD)" != \
                 "$(git -C "$cache_dir" rev-parse FETCH_HEAD)" ]; then
              git -C "$cache_dir" reset --hard FETCH_HEAD || return
            fi
          fi
          # No local commits: avoid the previously unbounded reflog on this
          # small PVC.
          git -C "$cache_dir" config core.logAllRefUpdates false || return
          rm -rf "$cache_dir/.git/logs"
        }

        prepare_config() {
          local target="$1"
          cp "${SECRETS_DIR:-/hass-secrets}/secret.yaml" "$target/secrets.yaml"
          mkdir -p "$target/.storage"
          cp "$init_dir/onboarding" "$target/.storage/onboarding"
          cp "${PASSWORDS_DIR:-/hass-passwords}/hass-passwords.json" \
            "$target/.storage/auth_provider.homeassistant"
          printf '%s\n' 'purge_keep_days: 60' 'commit_interval: 30' \
            'db_url: "sqlite:////recorder/home-assistant_v2.db"' \
            > "$target/recorder.yaml"
        }

        config_hash() {
          (
            cd "$1" || exit
            # Hash relative names AND contents; UI assets and Git metadata are
            # not
            # automation config. NUL separators preserve filenames with spaces.
            find . -type f ! -path './.git/*' ! -path './www/*' \
              ! -path './init/*' ! -name '.hass-config-sha1' \
              ! -name '.HA_VERSION' \
              -print0 | sort -z | xargs -0 sha1sum | sha1sum | awk '{print $1}'
          )
        }
      init.sh: |-
        #!/bin/bash
        set -eEuo pipefail
        # shellcheck source=common.sh
        source "${INIT_DIR:-/config/init}/common.sh"

        if [ ! -s "$cache_dir/configuration.yaml" ]; then
          if [ -s "$config_dir/configuration.yaml" ]; then
            echo "Incomplete cache; retaining existing Home Assistant config."
            prepare_config "$config_dir"
            # No source baseline until a complete repository is available.
            rm -f "$config_dir/.hass-config-sha1"
            exit 0
          fi
          echo "No local config: bootstrapping the initial configuration."
          if ! refresh_repo; then
            echo "ERROR: no usable config; initial download failed." >&2
            exit 1
          fi
        fi
        test -s "$cache_dir/configuration.yaml"
        prepare_config "$cache_dir"

        # Do not delete integration state, image metadata, or the mounted
        # ConfigMap.
        # In particular, never ignore rsync errors and then start with partial
        # config.
        rsync -a --delete --exclude .storage/ --exclude .git/ \
          --exclude '*.tmp' \
          --exclude .HA_VERSION --exclude .hass-config-sha1 --exclude /init/ \
          "$cache_dir/" "$config_dir/"
        mkdir -p "$config_dir/.storage"
        rsync -a "$cache_dir/.storage/" "$config_dir/.storage/"
        config_hash "$cache_dir" > "$config_dir/.hass-config-sha1"
      sync.sh: |-
        #!/bin/bash
        set -eEuo pipefail
        # shellcheck source=common.sh
        source "${INIT_DIR:-/config/init}/common.sh"

        touch "$progress_file"
        # Written by init, not the sidecar: represents config loaded by this
        # Pod.
        # A reloader-only restart must not trigger a new Home Assistant rollout.
        last_sha1=""
        if [ -f "$config_dir/.hass-config-sha1" ]; then
          last_sha1=$(< "$config_dir/.hass-config-sha1")
        fi

        while true; do
          touch "$progress_file"
          if ! refresh_repo; then
            echo "Refresh unavailable; keeping local config and retrying." >&2
          fi

          if [ -s "$cache_dir/configuration.yaml" ]; then
            prepare_config "$cache_dir"
            sha1=$(config_hash "$cache_dir")
            if [ "$sha1" != "$last_sha1" ]; then
              patch='{"spec":{"template":{"metadata":{"annotations":{'
              patch+="\"conf-reloader-hass-config-sha1\":\"$sha1\"}}}}}"
              if timeout -k 5 "${PATCH_TIMEOUT:-15}" kubectl \
                --request-timeout=10s patch deployment home-assistant \
                -n "$NAMESPACE" \
                --patch "$patch"; then
                last_sha1="$sha1"
              else
                echo "Could not request config rollout; will retry." >&2
              fi
            fi

            # Optional assets run in a separate strict shell: failures must
            # not stop automation updates. Retry incomplete downloads later.
            if [ ! -f "$cache_dir/www/.download-complete" ]; then
              if ! timeout -k 5 "${ASSET_TIMEOUT:-180}" \
                bash "$init_dir/assets.sh"; then
                echo "Optional dashboard assets unavailable; will retry." >&2
              fi
              # The deployed reloader image has tar, but not rsync.
              # Only copy after download attempts, not every poll.
              mkdir -p "$config_dir/www"
              if ! (tar -C "$cache_dir/www" --exclude=.git \
                --exclude='*.tmp' -cf - . | \
                tar -C "$config_dir/www" -xf -); then
                rm -f "$cache_dir/www/.download-complete"
                echo "Could not publish optional assets; will retry." >&2
              fi
            fi
          fi
          touch "$progress_file"
          sleep "${REFRESH_INTERVAL:-60}"
        done
      health.sh: |-
        #!/bin/bash
        set -eEuo pipefail
        progress_file="${PROGRESS_FILE:-/tmp/conf-reloader-progress}"
        test -f "$progress_file"
        # A GitHub outage still advances the loop. Only a stuck loop is
        # unhealthy.
        test "$(( $(date +%s) - $(stat -c %Y "$progress_file") ))" -lt 600
      assets.sh: |-
        #!/bin/bash
        set -eEuo pipefail
        # shellcheck source=common.sh
        source "${INIT_DIR:-/config/init}/common.sh"
        www="$cache_dir/www"
        weather="$www/community/lovelace-meteofrance-weather-card"
        mkdir -p "$weather/icons" "$www/icons/weather_icons"
        github=https://github.com

        clone_asset() {
          local name="$1" repo="$2" ref="$3"
          if [ ! -d "$www/$name/.git" ]; then
            rm -rf "$www/$name.tmp"
            # Only the pinned commit needs history; keep tag clones small.
            if [ "$ref" = c246a4f ]; then
              bounded_git clone "$repo" "$www/$name.tmp"
            else
              bounded_git clone --depth=1 --branch "$ref" \
                "$repo" "$www/$name.tmp"
            fi
            git -C "$www/$name.tmp" -c advice.detachedHead=false checkout "$ref"
            # A previous failed/partial directory must not nest the new clone.
            rm -rf "${www:?}/${name:?}"
            mv "$www/$name.tmp" "$www/$name"
          fi
        }

        download_asset() {
          local url="$1" target="$2"
          if [ ! -s "$target" ]; then
            curl --fail --location --connect-timeout 10 --max-time 30 \
              "$url" -o "$target.tmp"
            mv "$target.tmp" "$target"
          fi
        }

        clone_asset auto-entities \
          "$github/thomasloven/lovelace-auto-entities.git" 1.12.1
        clone_asset template-entity-row \
          "$github/thomasloven/lovelace-template-entity-row" 1.3.2
        clone_asset lovelace-cards \
          "$github/rodrigofragadf/lovelace-cards.git" c246a4f
        clone_asset lovelace-layout-cards \
          "$github/thomasloven/lovelace-layout-card.git" 2.4.4
        header="$github/maykar/custom-header/releases/download/1.3.2"
        download_asset "$header/custom-header.js" "$www/custom-header.js"
        mini="$github/kalkih/mini-graph-card/releases/download/v0.9.2"
        download_asset "$mini/mini-graph-card-bundle.js" \
          "$www/mini-graph-card-bundle.js"
        base=https://raw.githubusercontent.com/hacf-fr
        base=$base/lovelace-meteofrance-weather-card/Meteo-France/dist
        for file in meteofrance-weather-card.js \
          meteofrance-weather-card-editor.js \
          icons/cloudy-day-3.svg icons/cloudy-night-3.svg \
          icons/cloudy.svg icons/day.svg icons/night.svg; do
          download_asset "$base/$file" "$weather/$file"
        done
        if [ ! -f "$www/icons/weather_icons/.complete" ]; then
          amcharts=https://download.amcharts.com/1.0
          download_asset "$amcharts/amcharts_weather_icons_1.0.0.zip" \
            /tmp/amcharts.zip
          unzip -o /tmp/amcharts.zip -d "$www/icons/weather_icons"
          rm -f /tmp/amcharts.zip
          touch "$www/icons/weather_icons/.complete"
        fi
        touch "$www/.download-complete"
